name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node -c src/main/main.js
          node -c src/main/preload.js
          node -c src/main/quota-service.js
          node -c src/renderer/renderer.js
          node -c src/renderer/theme-manager.js
          node -c src/renderer/themes.js
          node -c scripts/debug-quota.js

      - name: Sanitization tests
        run: npm run test:sanitize --if-present

      - name: Build unpacked app
        run: npm run build:dir
