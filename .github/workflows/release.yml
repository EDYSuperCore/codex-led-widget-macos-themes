name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node -c src/main/main.js
          node -c src/main/preload.js
          node -c src/main/quota-service.js
          node -c src/renderer/renderer.js
          node -c src/renderer/theme-manager.js
          node -c src/renderer/themes.js
          node -c scripts/debug-quota.js

      - name: Sanitization tests
        run: npm run test:sanitize --if-present

      - name: Build macOS packages
        run: npm run build:mac -- --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node -c src/main/main.js
          node -c src/main/preload.js
          node -c src/main/quota-service.js
          node -c src/renderer/renderer.js
          node -c src/renderer/theme-manager.js
          node -c src/renderer/themes.js
          node -c scripts/debug-quota.js

      - name: Sanitization tests
        run: npm run test:sanitize --if-present

      - name: Build Windows portable
        run: npm run build:win -- --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs:
      - build-macos
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
          prerelease: false
